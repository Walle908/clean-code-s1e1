<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body class="page">
    <header class="header">
      <img class="header__img" src="./eisenhower-matrix.jpg" alt="Eisenhower matrix">
      <a class="header__link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </header>
    <main class="main">
      <section class="add-task">
        <h3 class="add-task__title title">Add Item</h3>
        <div class="add-task__wrapper">
          <input id="add-task-input" class="input-text" type="text">
          <button id="add-task-button" class="button">Add</button>
        </div>
      </section>
      <section class="todo-task">
      <h3 class="title">Todo</h3>
      <ul id="todo-task-list" class="task-list">
        <li class="task">
          <input type="checkbox" class="task__input-checkbox">
          <label class="task__label">Pay Bills</label>
          <input type="text" class="task__input-text input-text">
          <button class="button button_edit">Edit</button>
          <button class="button button_delete"><img class="button__img" src="./remove.svg" alt="Delete button"></button>
        </li>
        <li class="task task_edit">
          <input type="checkbox" class="task__input-checkbox">
          <label class="task__label">Go Shopping</label>
          <input type="text" value="Go Shopping" class="task__input-text input-text">
          <button class="button button_edit">Save</button>
          <button class="button button_delete"><img class="button__img" src="./remove.svg" alt="Delete button"></button>
        </li>
      </ul>
      </section>
      <section class="done-task">
      <h3 class="title">Completed</h3>
      <ul id="done-task-list" class="task-list">
        <li class="task">
          <input type="checkbox" class="task__input-checkbox" checked>
          <label class="task__label">See the Doctor</label>
          <input type="text" class="task__input-text input-text">
          <button class="button button_edit">Edit</button>
          <button class="button button_delete"><img class="button__img" src="./remove.svg" alt="Delete button"></button>
        </li>
      </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
