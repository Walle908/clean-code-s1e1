<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body>
    <header class="header">
      <img class="header__img" src="./eisenhower-matrix.jpg" alt="Eisenhower matrix">
      <a class="header__link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </header>
    <main class="main">
      <section class="add-task">
        <h3 class="add-task__title title_h3">Add Item</h3>
        <div class="add-task__wrapper">
          <input id="addTaskInput" class="task__input task__input_text" type="text">
          <button id="addTaskButton" class="task__btn">Add</button>
        </div>
      </section>
      <section class="todo-task">
      <h3 class="title_h3">Todo</h3>
      <ul id="toDoTaskList" class="task__list">
        <li class="task__item">
          <input type="checkbox" class="task__input task__input_checkbox">
          <label class="task__label">Pay Bills</label>
          <input type="text" class="task__input task__input_text">
          <button class="task__btn task__btn_edit">Edit</button>
          <button class="task__btn task__btn_delete"><img class="btn_delete__img" src="./remove.svg" alt="Delete button"></button>
        </li>
        <li class="task__item task__item_edit">
          <input type="checkbox" class="task__input task__input_checkbox">
          <label class="task__label">Go Shopping</label>
          <input type="text" value="Go Shopping" class="task__input task__input_text">
          <button class="task__btn task__btn_edit">Save</button>
          <button class="task__btn task__btn_delete"><img class="btn_delete__img" src="./remove.svg" alt="Delete button"></button>
        </li>
      </ul>
      </section>
      <section class="done-task">
      <h3 class="title_h3">Completed</h3>
      <ul id="doneTaskList" class="task__list">
        <li class="task__item">
          <input type="checkbox" class="task__input task__input_checkbox" checked>
          <label class="task__label">See the Doctor</label>
          <input type="text" class="task__input task__input_text">
          <button class="task__btn task__btn_edit">Edit</button>
          <button class="task__btn task__btn_delete"><img class="btn_delete__img" src="./remove.svg" alt="Delete button"></button>
        </li>
      </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
